<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auteurs</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Liste des Auteurs</h2>
    <a href="/auteurs/new" class="btn btn-primary mb-3">+ Ajouter un auteur</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Nationalité</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="auteur : ${auteurs}">
                <td th:text="${auteur.id}"></td>
                <td th:text="${auteur.nom}"></td>
                <td th:text="${auteur.prenom}"></td>
                <td th:text="${auteur.nationalite}"></td>
                <td>
                    <a th:href="@{/auteurs/edit/{id}(id=${auteur.id})}" class="btn btn-warning btn-sm">Modifier</a>
                    <a th:href="@{/auteurs/delete/{id}(id=${auteur.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Supprimer?')">Supprimer</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
