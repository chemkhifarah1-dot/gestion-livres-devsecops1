<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auteur</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Ajouter / Modifier un Auteur</h2>
    <form th:action="@{/auteurs}" th:object="${auteur}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label>Nom</label>
            <input type="text" class="form-control" th:field="*{nom}" required>
        </div>
        <div class="mb-3">
            <label>Prénom</label>
            <input type="text" class="form-control" th:field="*{prenom}" required>
        </div>
        <div class="mb-3">
            <label>Nationalité</label>
            <input type="text" class="form-control" th:field="*{nationalite}">
        </div>
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <a href="/auteurs" class="btn btn-secondary">Annuler</a>
    </form>
</div>
</body>
</html>
