<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Livres</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Liste des Livres</h2>
    <a href="/livres/new" class="btn btn-primary mb-3">+ Ajouter un livre</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Titre</th>
                <th>ISBN</th>
                <th>Genre</th>
                <th>Année</th>
                <th>Prix</th>
                <th>Disponible</th>
                <th>Auteur</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="livre : ${livres}">
                <td th:text="${livre.id}"></td>
                <td th:text="${livre.titre}"></td>
                <td th:text="${livre.isbn}"></td>
                <td th:text="${livre.genre}"></td>
                <td th:text="${livre.anneePublication}"></td>
                <td th:text="${livre.prix}"></td>
                <td th:text="${livre.disponible ? 'Oui' : 'Non'}"></td>
                <td th:text="${livre.auteur != null ? livre.auteur.nom + ' ' + livre.auteur.prenom : ''}"></td>
                <td>
                    <a th:href="@{/livres/edit/{id}(id=${livre.id})}" class="btn btn-warning btn-sm">Modifier</a>
                    <a th:href="@{/livres/delete/{id}(id=${livre.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Supprimer?')">Supprimer</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
