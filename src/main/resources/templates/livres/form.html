<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Livre</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Ajouter / Modifier un Livre</h2>
    <form th:action="@{/livres}" th:object="${livre}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3">
            <label>Titre</label>
            <input type="text" class="form-control" th:field="*{titre}" required>
        </div>
        <div class="mb-3">
            <label>ISBN</label>
            <input type="text" class="form-control" th:field="*{isbn}">
        </div>
        <div class="mb-3">
            <label>Genre</label>
            <input type="text" class="form-control" th:field="*{genre}">
        </div>
        <div class="mb-3">
            <label>Année de publication</label>
            <input type="number" class="form-control" th:field="*{anneePublication}">
        </div>
        <div class="mb-3">
            <label>Prix</label>
            <input type="number" step="0.01" class="form-control" th:field="*{prix}">
        </div>
        <div class="mb-3">
            <label>Disponible</label>
            <select class="form-control" th:field="*{disponible}">
                <option value="true">Oui</option>
                <option value="false">Non</option>
            </select>
        </div>
        <div class="mb-3">
            <label>Auteur</label>
            <select class="form-control" name="auteurId" required>
                <option th:each="auteur : ${auteurs}"
                        th:value="${auteur.id}"
                        th:text="${auteur.nom + ' ' + auteur.prenom}"
                        th:selected="${livre.auteur != null && livre.auteur.id == auteur.id}">
                </option>
            </select>
        </div>
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <a href="/livres" class="btn btn-secondary">Annuler</a>
    </form>
</div>
</body>
</html>
