<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Emprunt</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

    <h2>Nouvel Emprunt</h2>

    <form th:action="@{/emprunts}" th:object="${emprunt}" method="post">

        <input type="hidden" th:field="*{id}">

        <!-- Nom Client -->
        <div class="mb-3">
            <label>Nom du client</label>
            <input type="text" class="form-control" th:field="*{nomClient}" required>
        </div>

        <!-- Date Retour -->
        <div class="mb-3">
            <label>Date de retour</label>
            <input type="date" class="form-control" th:field="*{dateRetour}">
        </div>

        <!-- Livre -->
        <div class="mb-3">
            <label>Livre</label>
            <select class="form-control" name="livreId" required>
                <option value="" disabled selected>Choisir un livre</option>

                <option th:each="livre : ${livres}"
                        th:value="${livre.id}"
                        th:text="${livre.titre}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Enregistrer</button>

    </form>

</div>

</body>
</html>
