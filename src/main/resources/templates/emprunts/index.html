<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Emprunts</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h2>Liste des Emprunts</h2>
    <a href="/emprunts/new" class="btn btn-primary mb-3">+ Nouvel emprunt</a>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Client</th>
                <th>Livre</th>
                <th>Date Emprunt</th>
                <th>Date Retour</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emprunt : ${emprunts}">
                <td th:text="${emprunt.id}"></td>
                <td th:text="${emprunt.nomClient}"></td>
                <td th:text="${emprunt.livre != null ? emprunt.livre.titre : ''}"></td>
                <td th:text="${emprunt.dateEmprunt}"></td>
                <td th:text="${emprunt.dateRetour}"></td>
                <td>
                    <a th:href="@{/emprunts/edit/{id}(id=${emprunt.id})}" class="btn btn-warning btn-sm">Modifier</a>
                    <a th:href="@{/emprunts/delete/{id}(id=${emprunt.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Supprimer?')">Supprimer</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
